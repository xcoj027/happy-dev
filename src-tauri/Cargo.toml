[package]
name = "happy-dev"
version = "1.0.0"
description = "Offline developer utilities"
authors = ["TNQSW"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
arboard = "3.7.0"
base64 = "0.23.1"
dirs = "7.0.0"
image = "0.25.6"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
xcap = "0.9.8"

[profile.dev]
# Omit full native debug symbols to keep local build caches smaller.
debug = 0

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
