name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: happy-dev-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cleanup-old-artifacts:
    name: Prepare release version and clean old artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine next release version
        id: version
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || 'xcoj027/happy-dev-releases' }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::RELEASE_TOKEN is required to determine the next release version."
            exit 1
          fi
          numbers=$(gh api --paginate "repos/$TARGET_REPOSITORY/tags?per_page=100" \
            --jq '.[] | .name | select(test("^v\\.[1-9][0-9]*$")) | ltrimstr("v.")')
          last=$(printf '%s\n' "$numbers" | sort -n | tail -n 1)
          next=$(( ${last:-0} + 1 ))
          echo "version=v.$next" >> "$GITHUB_OUTPUT"

      - name: Delete previous platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("happydev-")) | .id' |
          while read -r artifact_id; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

  build-packages:
    name: Build (${{ matrix.platform }})
    needs: cleanup-old-artifacts
    if: always() && (needs.cleanup-old-artifacts.result == 'success' || needs.cleanup-old-artifacts.result == 'skipped')
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ needs.cleanup-old-artifacts.outputs.version || 'local' }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            package_script: dist:mac
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            installer_suffix: mac-universal.dmg
          - os: windows-latest
            platform: windows
            package_script: dist:win
            rust_targets: x86_64-pc-windows-msvc
            installer_suffix: windows-x64-setup.exe
          - os: ubuntu-22.04
            platform: linux
            package_script: dist:linux
            rust_targets: x86_64-unknown-linux-gnu
            installer_suffix: linux-x64.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file xdg-utils

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Type-check application
        run: npm run lint

      - name: Package application
        if: runner.os != 'macOS' || github.event_name == 'pull_request' || vars.MACOS_SIGNING_ENABLED != 'true'
        run: npm run ${{ matrix.package_script }}
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Sign and notarize macOS application
        if: runner.os == 'macOS' && github.event_name != 'pull_request' && vars.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.MAC_CSC_LINK }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for credential in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!credential}" ]]; then
              echo "::error::Missing macOS signing credential: $credential. See README.md for setup."
              exit 1
            fi
          done
          if [[ "$APPLE_SIGNING_IDENTITY" != "Developer ID Application:"* ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
            exit 1
          fi
          certificate_path="$RUNNER_TEMP/happydev-signing.p12"
          keychain_path="$RUNNER_TEMP/happydev-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          export CERTIFICATE_PATH="$certificate_path"
          node -e 'require("node:fs").writeFileSync(process.env.CERTIFICATE_PATH, Buffer.from(process.env.APPLE_CERTIFICATE, "base64"))'
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain_path" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          rm -f "$certificate_path"
          npm run dist:mac

          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/HappyDev.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Remove temporary signing credentials
        if: always() && runner.os == 'macOS' && github.event_name != 'pull_request' && vars.MACOS_SIGNING_ENABLED == 'true'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/happydev-signing.p12"
          if [[ -f "$RUNNER_TEMP/happydev-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/happydev-signing.keychain-db"
          fi

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: happydev-${{ matrix.platform }}
          path: release/tauri/${{ env.APP_VERSION }}/HappyDev-${{ env.APP_VERSION }}-${{ matrix.installer_suffix }}
          if-no-files-found: error
          retention-days: 1

  publish-release:
    name: Publish public release
    needs: [cleanup-old-artifacts, build-packages]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.cleanup-old-artifacts.outputs.version }}
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: happydev-*
          path: downloaded-artifacts

      - name: Prepare release assets and checksums
        shell: bash
        run: |
          mkdir -p release-assets
          find downloaded-artifacts -type f \( \
            -name "HappyDev-${APP_VERSION}-mac-universal.dmg" -o \
            -name "HappyDev-${APP_VERSION}-windows-x64-setup.exe" -o \
            -name "HappyDev-${APP_VERSION}-linux-x64.AppImage" \
          \) -exec cp {} release-assets/ \;

          for extension in dmg exe AppImage; do
            count=$(find release-assets -maxdepth 1 -type f -name "*.$extension" | wc -l)
            if [[ "$count" -ne 1 ]]; then
              echo "::error::Expected exactly one .$extension installer, found $count."
              exit 1
            fi
          done

          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Determine release metadata
        id: release_info
        shell: bash
        run: |
          echo "title=HappyDev ${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate release token for public repository
        id: release_target
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || 'xcoj027/happy-dev-releases' }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Add a fine-grained PAT as the RELEASE_TOKEN secret. Grant Contents read/write access to $TARGET_REPOSITORY."
            exit 1
          fi

          if ! default_branch=$(gh api "repos/$TARGET_REPOSITORY" --jq '.default_branch'); then
            echo "::error::RELEASE_TOKEN cannot access $TARGET_REPOSITORY."
            exit 1
          fi

          # Resolve a commit in the public repository, which may use a different branch.
          target_commit=$(gh api --method GET "repos/$TARGET_REPOSITORY/commits" \
            -f sha="$default_branch" -f per_page=1 --jq '.[0].sha')
          if [[ ! "$target_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot resolve a release target commit in $TARGET_REPOSITORY. Ensure its default branch has a commit."
            exit 1
          fi
          echo "commit=$target_commit" >> "$GITHUB_OUTPUT"

      - name: Remove previous public releases
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ vars.RELEASE_REPOSITORY || 'xcoj027/happy-dev-releases' }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh api --paginate "repos/$TARGET_REPOSITORY/releases?per_page=100" --jq '.[].id' |
          while read -r release_id; do
            if [[ "$release_id" =~ ^[0-9]+$ ]]; then
              gh api --method DELETE "repos/$TARGET_REPOSITORY/releases/$release_id"
            fi
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.RELEASE_REPOSITORY || 'xcoj027/happy-dev-releases' }}
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          target_commitish: ${{ steps.release_target.outputs.commit }}
          name: ${{ steps.release_info.outputs.title }}
          body: Automated HappyDev packages for ${{ steps.release_info.outputs.title }}. Source commit ${{ github.sha }}.
          prerelease: false
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
