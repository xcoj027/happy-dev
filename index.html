<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: http: https:; connect-src 'self' ws: http: https:;" />
    <script>
      (() => {
        let theme = 'light';

        try {
          theme = localStorage.getItem('happydev_theme') === 'dark' ? 'dark' : 'light';
        } catch {
          theme = 'light';
        }

        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
      })();
    </script>
    <title>HappyDev - Developer Utilities Suite</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  </head>
  <body class="bg-[var(--bg-main)] text-[var(--text-primary)] antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
